name: Tests & Veröffentlichung

on:
  push:
  pull_request:
  workflow_dispatch: # manuell starten: Actions → „Tests & Veröffentlichung“ → Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    # Nur vom main-Branch und nur, wenn alle Tests grün sind
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App mit Passwort verschlüsseln
        run: node scripts/build.js dist
        env:
          WICHTEL_PASSWORT: ${{ secrets.WICHTEL_PASSWORT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
